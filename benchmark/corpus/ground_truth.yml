architecture_decisions:
  adr_001:
    title: "Redis Streams for Ingestion Buffer"
    rejected: ["Apache Kafka", "RabbitMQ"]
    selected: "Redis Streams"
    reason: "Low operational complexity, sub-4GB memory overhead, millisecond consumer group latency"
  adr_002:
    title: "PostgreSQL pgvector vs Pinecone"
    rejected: ["Pinecone"]
    selected: "PostgreSQL pgvector"
    reason: "Transactional ACID boundary, no external cloud egress fees"
  adr_003:
    title: "Welford's Method Rolling Z-Score"
    algorithm: "Welford's single-pass algorithm"
    window: "15-minute sliding window"
    alert_threshold: "|Z| > 3.2"

